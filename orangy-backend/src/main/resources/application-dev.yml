spring:
  # PostgreSQL (use when Docker is running)
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/orangy_db
  #   username: orangy
  #   password: orangy_secret
  #   driver-class-name: org.postgresql.Driver

  # Fallback: uncomment H2 and comment out PostgreSQL above if no Postgres available
  datasource:
    url: jdbc:h2:mem:orangy_db;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # H2 Console (only for dev when using H2)
  h2:
    console:
      enabled: true
      path: /h2-console

  # MongoDB
  data:
    mongodb:
      uri: mongodb://localhost:27017/orangy_media
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.orangy: DEBUG
    org.springframework.security: DEBUG

# Local-development fallbacks only. The prod profile has no defaults for these:
# every environment must supply them explicitly (in Kubernetes they come from
# the `orangy-secrets` Secret). This value is not a secret — it exists so
# `mvn spring-boot:run` works with no environment set up.
app:
  jwt:
    secret: ${JWT_SECRET:local-development-only-jwt-signing-key-not-used-anywhere-else-256bits}
