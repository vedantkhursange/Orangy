server:
  port: 8080

spring:
  application:
    name: orangy-backend

  profiles:
    active: dev

  # JPA defaults (overridden per profile)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Mail (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiry-ms: ${JWT_EXPIRATION_MS:900000}       # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days

  # Razorpay
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}

  # CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Admin Seeder
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_DEFAULT_PASSWORD:}
    notification-email: ${ADMIN_NOTIFICATION_EMAIL:}

  # OTP
  otp:
    expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
    length: ${OTP_LENGTH:6}

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator — exposed purely for Kubernetes probes.
# Only /actuator/health is reachable, and it never shows component detail, so
# it cannot be used to fingerprint the stack or leak connection strings.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
